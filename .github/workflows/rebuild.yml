name: Rebuild SLIZZ from Notion

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes, all day, every day
  workflow_dispatch:          # Also run manually anytime
  push:
    paths:
      - 'build.mjs'           # Rebuild if the build script changes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild index.html from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node build.mjs

      - name: Commit and push if changed
        run: |
          git config user.name  "Zoli Bot"
          git config user.email "zoli@thinslizzy.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-rebuild from Notion $(date '+%d %b %Y %H:%M AEST')"
          git push
